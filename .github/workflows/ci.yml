name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: nextjs-dashboard

env:
  APP_ENV: test
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  # Supabase CLI's documented local-only anon key. It is public and has no
  # access outside the disposable stack.
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: >-
    eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  RATE_LIMIT_ADAPTER: memory
  ERROR_REPORTER_ADAPTER: console

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      full-suite: ${{ steps.scope.outputs.full-suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine verification scope
        id: scope
        shell: bash
        run: |
          full_suite=true

          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.head_ref }}" != release/* ]]; then
            mapfile -t changed_files < <(
              git diff --name-only "origin/${{ github.base_ref }}...HEAD"
            )

            if (( ${#changed_files[@]} > 0 )); then
              full_suite=false
              for changed_file in "${changed_files[@]}"; do
                if [[ "$changed_file" != *.md ]]; then
                  full_suite=true
                  break
                fi
              done
            fi
          fi

          echo "full-suite=$full_suite" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: nextjs-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: git diff --check
      - run: pnpm supabase start
        if: steps.scope.outputs.full-suite == 'true'
      - run: pnpm db:reset
        if: steps.scope.outputs.full-suite == 'true'
      - run: pnpm lint
        if: steps.scope.outputs.full-suite == 'true'
      - run: pnpm typecheck
        if: steps.scope.outputs.full-suite == 'true'
      - run: pnpm test
        if: steps.scope.outputs.full-suite == 'true'
      - run: pnpm test:integration
        if: steps.scope.outputs.full-suite == 'true'
      - run: pnpm build
        if: steps.scope.outputs.full-suite == 'true'
      - run: pnpm audit:prod
        if: steps.scope.outputs.full-suite == 'true'

  browser:
    runs-on: ubuntu-latest
    needs: verify
    if: needs.verify.outputs.full-suite == 'true'
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, pixel, iphone]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: nextjs-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start
      - run: pnpm db:reset
      - run: pnpm exec playwright install --with-deps
      - run: pnpm build
      - run: pnpm test:e2e --project=${{ matrix.project }}
