name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: nextjs-dashboard

env:
  APP_ENV: test
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  # Supabase CLI's documented local-only anon key. It is public and has no
  # access outside the disposable stack.
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: >-
    eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  RATE_LIMIT_ADAPTER: memory
  ERROR_REPORTER_ADAPTER: console

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: nextjs-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start
      - run: pnpm db:reset
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit:prod

  browser:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, pixel, iphone]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: nextjs-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start
      - run: pnpm db:reset
      - run: pnpm exec playwright install --with-deps
      - run: pnpm build
      - run: pnpm test:e2e --project=${{ matrix.project }}
